[package]
name = "hext"
version = "0.1.0"
edition = "2024"
description = "A minimal GPU-accelerated terminal emulator template built on wgpu"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
# Windowing + the GPU abstraction the renderer is written against.
winit = "0.30.13"
wgpu = "30.0.1"
pollster = "1.0.1"

# Hosting a shell: `portable-pty` allocates the pty pair and spawns the child.
portable-pty = "0.9.0"

# Text: `fontdb` finds a monospace font installed on the system, `fontdue`
# rasterizes glyphs into the coverage atlas the shader samples.
fontdb = "0.24.0"
fontdue = "0.9.4"

# The picture a config can put behind the grid: PNG and JPEG are enough for a
# wallpaper, and the rest of `image`'s decoders would be dead weight.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

bytemuck = { version = "1.25.2", features = ["derive"] }
anyhow = "1.0.100"
env = "1.0.1"
vte = "0.15.0"
nalgebra = "0.32.5"
pyo3 = { version = "0.29.3", features = ["auto-initialize"] }

# The WGSL front end wgpu itself compiles shaders with, used directly because
# `config.py` may name a shader: a source that would not build is found here,
# reported, and replaced by the built-in one instead of taking the process down
# — at startup, and again whenever the file is reloaded.
naga = { version = "30.0.1", features = ["wgsl-in"] }

# The clipboard a selection is copied to: text only, so the image support and
# the Wayland backend its default features pull in are left out.
arboard = { version = "3.6.1", default-features = false }

[dev-dependencies]
# The shader tests validate WGSL on machines with no graphics driver. `naga` is
# a real dependency too, because the app checks a config's shader with it.

# Best-effort release profile: a terminal is a latency-sensitive interactive
# program, and thin LTO keeps the binary small without a long link step.
[profile.release]
lto = "thin"
codegen-units = 1
